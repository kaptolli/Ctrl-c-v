<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover ОБЯЗАТЕЛЕН, чтобы телефон отдал приложению информацию о безопасных зонах -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ctrl C+V</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0a0e14;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    
    /* Используем динамическую высоту (dvh), чтобы клавиатура не перекрывала кнопки */
    height: 100dvh; 
    display: flex;
    flex-direction: column;
    
    /* МАГИЯ SAFE AREA: Отступает контент от системных панелей */
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    overflow: hidden;
  }
  
  h1 { font-size: 22px; text-align: center; margin-bottom: 15px; color: #58a6ff; flex-shrink: 0; }
  .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; flex-shrink: 0; }
  
  input {
    background: #161b22;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px; /* 16px обязательно, иначе iOS/Android будет зумить при клике */
    outline: none;
    width: 100%;
  }
  input:focus { border-color: #58a6ff; }
  
  .btn-row { display: flex; gap: 10px; flex-shrink: 0; margin-bottom: 10px; }
  
  button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: #238636;
    color: white;
    transition: background 0.2s;
  }
  button:active { background: #2ea043; }
  button:disabled { opacity: 0.5; }
  button.secondary { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
  button.secondary:active { background: #30363d; }
  
  /* Лог занимает всё оставшееся место и скроллится */
  #log {
    flex: 1;
    min-height: 0; /* Важно для правильного скролла внутри flex */
    background: #010409;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: #8b949e;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .log-entry { margin-bottom: 6px; }
  .log-entry.error { color: #f85149; }
  .log-entry.success { color: #3fb950; }
  .log-entry.info { color: #58a6ff; }
  a { color: #58a6ff; text-decoration: underline; word-break: break-all; }
</style>
</head>
<body>
  <h1>📥 Ctrl C+V</h1>
  
  <div class="input-group">
    <input type="url" id="urlInput" placeholder="Вставьте ссылку на видео" autocomplete="off">
  </div>
  
  <div class="btn-row">
    <button class="secondary" id="pasteBtn">📋 Вставить</button>
    <button id="downloadBtn">⬇️ Скачать</button>
  </div>
  
  <div id="log"></div>
  
  <div class="btn-row" style="margin-bottom: 0;">
    <button class="secondary" id="clearBtn">🗑️ Очистить лог</button>
  </div>

<script>
  const urlInput = document.getElementById('urlInput');
  const logEl = document.getElementById('log');
  const API_URLS = [
    'https://api.cobalt.tools/api/json',
    'https://co.wuk.sh/api/json'
  ];

  function log(msg, type = '') {
    const div = document.createElement('div');
    div.className = 'log-entry ' + type;
    div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  document.getElementById('pasteBtn').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      urlInput.value = text;
      log('Ссылка вставлена из буфера', 'info');
    } catch (e) {
      log('Не удалось прочитать буфер. Вставьте вручную.', 'error');
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    logEl.innerHTML = '';
  });

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    let url = urlInput.value.trim();
    if (!url) { log('Введите ссылку!', 'error'); return; }
    
    log('Запрос к серверу...', 'info');
    urlInput.disabled = true;
    document.getElementById('downloadBtn').disabled = true;

    let success = false;

    for (const api of API_URLS) {
      if (success) break;
      try {
        const res = await fetch(api, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: url,
            vQuality: '720'
          })
        });

        if (!res.ok) throw new Error('Сервер вернул ' + res.status);
        const data = await res.json();
        
        if (data.status === 'error') throw new Error(data.text || 'Ошибка API');
        if (!data.url) throw new Error('Нет ссылки на видео');

        log('Ссылка получена! Начинаю скачивание...', 'success');
        
        const videoRes = await fetch(data.url);
        if (!videoRes.ok) throw new Error('Не удалось скачать видео');
        
        const blob = await videoRes.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = 'video_' + Date.now() + '.mp4';
        document.body.appendChild(a);
        a.click();
        a.remove();
        
        log('✅ Скачивание начато! Проверьте папку "Загрузки".', 'success');
        success = true;

        setTimeout(() => {
          if (!navigator.userAgent.includes('wv')) {
            log('Если файл не скачался, откройте вручную:', 'info');
            const link = document.createElement('a');
            link.href = data.url;
            link.target = '_blank';
            link.textContent = 'Открыть видео';
            logEl.appendChild(link);
            logEl.scrollTop = logEl.scrollHeight;
          }
        }, 2000);

      } catch (e) {
        log('❌ Ошибка: ' + e.message, 'error');
      }
    }

    if (!success) {
      if (url.includes('.mp4') || url.includes('.webm')) {
        log('Ссылка прямая, пробую скачать напрямую...', 'info');
        const a = document.createElement('a');
        a.href = url;
        a.download = 'video_' + Date.now() + '.mp4';
        document.body.appendChild(a);
        a.click();
        a.remove();
        log('✅ Скачивание начато!', 'success');
      } else {
        log('Не удалось получить ссылку. Попробуйте другую ссылку.', 'error');
      }
    }

    urlInput.disabled = false;
    document.getElementById('downloadBtn').disabled = false;
  });

  // Обработка ссылки, если приложение открыли через "Поделиться"
  const params = new URLSearchParams(window.location.search);
  if (params.has('url')) {
    urlInput.value = params.get('url');
    log('Ссылка получена из системного меню.', 'info');
  }

  log('Приложение готово. Вставьте ссылку и нажмите "Скачать".');
</script>
</body>
</html>
