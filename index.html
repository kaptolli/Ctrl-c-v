<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ctrl C+V</title>
<!-- Подключаем манифест -->
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0a0e14;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100dvh; 
    display: flex;
    flex-direction: column;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    overflow: hidden;
  }
  h1 { font-size: 22px; text-align: center; margin-bottom: 15px; color: #58a6ff; flex-shrink: 0; }
  .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; flex-shrink: 0; }
  input {
    background: #161b22; border: 1px solid #30363d; color: #e6edf3;
    padding: 14px; border-radius: 8px; font-size: 16px; outline: none; width: 100%;
  }
  input:focus { border-color: #58a6ff; }
  .btn-row { display: flex; gap: 10px; flex-shrink: 0; margin-bottom: 10px; }
  button {
    flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px;
    font-weight: 600; cursor: pointer; background: #238636; color: white;
  }
  button:active { background: #2ea043; }
  button:disabled { opacity: 0.5; }
  button.secondary { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
  #log {
    flex: 1; min-height: 0; background: #010409; border: 1px solid #30363d;
    border-radius: 8px; padding: 12px; font-family: ui-monospace, monospace;
    font-size: 13px; color: #8b949e; overflow-y: auto; white-space: pre-wrap;
    margin-bottom: 10px; line-height: 1.5;
  }
  .log-entry { margin-bottom: 6px; }
  .log-entry.error { color: #f85149; }
  .log-entry.success { color: #3fb950; }
  .log-entry.info { color: #58a6ff; }
  a { color: #58a6ff; text-decoration: underline; word-break: break-all; }
</style>
</head>
<body>
  <h1>📥 Ctrl C+V</h1>
  
  <div class="input-group">
    <input type="url" id="urlInput" placeholder="Вставьте ссылку на видео" autocomplete="off">
  </div>
  
  <div class="btn-row">
    <button class="secondary" id="pasteBtn">📋 Вставить</button>
    <button id="downloadBtn">⬇️ Скачать</button>
  </div>
  
  <div id="log"></div>
  
  <div class="btn-row" style="margin-bottom: 0;">
    <button class="secondary" id="clearBtn">🗑️ Очистить лог</button>
  </div>

<script>
  const urlInput = document.getElementById('urlInput');
  const logEl = document.getElementById('log');
  const API_URLS = ['https://api.cobalt.tools/api/json', 'https://co.wuk.sh/api/json'];

  function log(msg, type = '') {
    const div = document.createElement('div');
    div.className = 'log-entry ' + type;
    div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  document.getElementById('pasteBtn').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      urlInput.value = text;
      log('Ссылка вставлена', 'info');
    } catch (e) { log('Вставьте вручную', 'error'); }
  });

  document.getElementById('clearBtn').addEventListener('click', () => { logEl.innerHTML = ''; });

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    let url = urlInput.value.trim();
    if (!url) { log('Введите ссылку!', 'error'); return; }
    log('Запрос к серверу...', 'info');
    urlInput.disabled = true;
    document.getElementById('downloadBtn').disabled = true;
    let success = false;

    for (const api of API_URLS) {
      if (success) break;
      try {
        const res = await fetch(api, {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url, vQuality: '720' })
        });
        if (!res.ok) throw new Error('Сервер вернул ' + res.status);
        const data = await res.json();
        if (data.status === 'error' || !data.url) throw new Error(data.text || 'Ошибка API');

        log('Ссылка получена! Начинаю скачивание...', 'success');
        const videoRes = await fetch(data.url);
        const blob = await videoRes.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = 'video_' + Date.now() + '.mp4';
        a.click();
        log('✅ Скачивание начато!', 'success');
        success = true;
      } catch (e) { log('❌ Ошибка: ' + e.message, 'error'); }
    }
    if (!success && (url.includes('.mp4') || url.includes('.webm'))) {
      const a = document.createElement('a'); a.href = url; a.download = 'video.mp4'; a.click();
      log('✅ Скачивание напрямую!', 'success'); success = true;
    }
    urlInput.disabled = false;
    document.getElementById('downloadBtn').disabled = false;
  });

  // Регистрация Service Worker (ОБЯЗАТЕЛЬНО ДЛЯ APK)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
